name: Kemaskini Data Munsyid

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kod
      uses: actions/checkout@v4

    - name: Sediakan Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Pasang Library 
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Jalankan Skrip Pengekstrakan
      run: python fetch_data.py

    - name: Simpan Fail CSV Baru ke GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add munsyid_data.csv
        git diff --quiet && git diff --staged --quiet || git commit -m "Automasi: Data Munsyid Dikemas Kini"
        git push
